name: Create Orphan Branch

on:
  workflow_dispatch:
    inputs:
      branch_name:
        description: 'Nama branch'
        required: false
        type: string

permissions:
  contents: write

jobs:
  create-orphan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine branch name
        id: get_branch
        run: |
          INPUT_NAME="${{ github.event.inputs.branch_name }}"
          INPUT_NAME=$(echo "$INPUT_NAME" | xargs)

          if [ -n "$INPUT_NAME" ]; then
            TARGET_BRANCH="$INPUT_NAME"
            if git ls-remote --exit-code --heads origin "$TARGET_BRANCH" >/dev/null 2>&1; then
              echo "Error: Branch '$TARGET_BRANCH' sudah ada di repository!"
              exit 1
            fi
          else
            COUNTER=1
            while true; do
              CANDIDATE="orphan${COUNTER}"
              if ! git ls-remote --exit-code --heads origin "$CANDIDATE" >/dev/null 2>&1; then
                TARGET_BRANCH="$CANDIDATE"
                break
              fi
              COUNTER=$((COUNTER + 1))
            done
          fi

          echo "Branch yang akan dibuat: $TARGET_BRANCH"
          echo "branch_name=$TARGET_BRANCH" >> $GITHUB_OUTPUT

      - name: Create and push orphan branch
        run: |
          BRANCH="${{ steps.get_branch.outputs.branch_name }}"

          # Konfigurasi identitas git
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git checkout --orphan "$BRANCH"

          git rm -rf . >/dev/null 2>&1 || true
          git clean -fd

          echo "# $BRANCH" > README.md

          git add README.md
          git commit -m "$BRANCH"
          git push -u origin "$BRANCH"
