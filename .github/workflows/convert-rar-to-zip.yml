name: Convert RAR Release to ZIP

on:
  release:
    types: [published]
  workflow_dispatch: # Memungkinkan eksekusi manual dari GitHub UI
    inputs:
      tag_name:
        description: 'Tag release yang ingin dikonversi (contoh: v1.0.0)'
        required: true
        type: string

jobs:
  convert-rar:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install unrar and zip
        run: |
          sudo apt-get update
          sudo apt-get install -y unrar zip

      - name: Determine Tag Name
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "TAG_NAME=${{ inputs.tag_name }}" >> $GITHUB_ENV
          else
            echo "TAG_NAME=${{ github.event.release.tag_name }}" >> $GITHUB_ENV
          fi

      - name: Download RAR assets from release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          assets=$(gh release view ${{ env.TAG_NAME }} --json assets -q '.assets[].name')
          
          mkdir -p rar_files extracted zip_files
          
          for asset in $assets; do
            if [[ "$asset" == *.rar ]]; then
              echo "Downloading $asset..."
              gh release download ${{ env.TAG_NAME }} -p "$asset" -D ./rar_files
            fi
          done

      - name: Extract RAR and Create ZIP
        run: |
          cd rar_files
          for rar_file in *.rar; do
            if [ -f "$rar_file" ]; then
              base_name="${rar_file%.rar}"
              mkdir -p "../extracted/$base_name"
              
              unrar x -o+ "$rar_file" "../extracted/$base_name/"
              
              cd "../extracted/$base_name"
              zip -r "../../zip_files/${base_name}.zip" .
              cd "../../rar_files"
            fi
          done

      - name: Upload ZIP asset and delete RAR asset
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Unggah file ZIP
          for zip_file in zip_files/*.zip; do
            if [ -f "$zip_file" ]; then
              echo "Uploading $zip_file to release..."
              gh release upload ${{ env.TAG_NAME }} "$zip_file" --clobber
            fi
          done

          # Hapus file RAR lama
          assets=$(gh release view ${{ env.TAG_NAME }} --json assets -q '.assets[].name')
          for asset in $assets; do
            if [[ "$asset" == *.rar ]]; then
              echo "Deleting old RAR asset: $asset..."
              gh release delete-asset ${{ env.TAG_NAME }} "$asset" -y
            fi
          done
